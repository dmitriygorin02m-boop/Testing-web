
image: Visual Studio 2022

install:
  - ps: |
      Write-Host "JAVA_HOME=$env:JAVA_HOME"
      Write-Host "Checking installed Java versions..."

      Get-ChildItem 'C:\Program Files\Java' -Directory | Select-Object FullName

      Write-Host "Checking JDK 11..."
      Test-Path 'C:\Program Files\Java\jdk11\bin\java.exe'

      if (Test-Path 'C:\Program Files\Java\jdk11\bin\java.exe') {
        $env:JAVA_HOME = 'C:\Program Files\Java\jdk11'
      } else {
        throw "JDK 11 was not found!"
      }

      $env:Path = "$env:JAVA_HOME\bin;$env:Path"

      & "$env:JAVA_HOME\bin\java.exe" -version
      & "$env:JAVA_HOME\bin\javac.exe" -version

      Start-Process -FilePath "$env:JAVA_HOME\bin\java.exe" -ArgumentList '-jar', './artifacts/app-order.jar' -WorkingDirectory $env:APPVEYOR_BUILD_FOLDER

build_script:
  - ps: |
      $env:JAVA_HOME = 'C:\Program Files\Java\jdk11'
      $env:Path = "$env:JAVA_HOME\bin;$env:Path"
      .\gradlew.bat clean build
