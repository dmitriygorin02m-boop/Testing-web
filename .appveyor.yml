
build_script:
      - ps: |
              Write-Host "Checking JDK 11 installation..."
              
              $jdk = Get-ChildItem 'C:\Program Files\Temurin' -Directory |
                Where-Object { $_.Name -like 'jdk-11*' } |
                Select-Object -First 1
              
              if (-not $jdk) {
                  throw "JDK 11 not found!"
              }
              
              $env:JAVA_HOME = $jdk.FullName
              $env:Path = "$env:JAVA_HOME\bin;$env:Path"
              
              Write-Host "Checking Java version:"
              java -version
              javac -version
              
              Write-Host "Starting application..."
              
              $app = Start-Process -FilePath "$env:JAVA_HOME\bin\java.exe" `
                -ArgumentList '-jar', './artifacts/app-order.jar' `
                -WorkingDirectory $env:APPVEYOR_BUILD_FOLDER `
                -RedirectStandardOutput "$env:APPVEYOR_BUILD_FOLDER\app.log" `
                -RedirectStandardError "$env:APPVEYOR_BUILD_FOLDER\app-error.log" `
                -PassThru
              
              Write-Host "Waiting for application..."
              
              $ready = $false
              
              for ($i = 0; $i -lt 30; $i++) {
                  try {
                      Invoke-WebRequest -Uri "http://localhost:9999" `
                        -UseBasicParsing -TimeoutSec 2 | Out-Null
              
                      $ready = $true
                      break
                  }
                  catch {
                      Start-Sleep -Seconds 2
                  }
              }
              
              if (-not $ready) {
                  Write-Host "Application failed to start!"
              
                  if (Test-Path "$env:APPVEYOR_BUILD_FOLDER\app.log") {
                      Get-Content "$env:APPVEYOR_BUILD_FOLDER\app.log"
                  }
              
                  if (Test-Path "$env:APPVEYOR_BUILD_FOLDER\app-error.log") {
                      Get-Content "$env:APPVEYOR_BUILD_FOLDER\app-error.log"
                  }
              
                  throw "Application did not start on port 9999!"
              }
              
              Write-Host "Application is ready!"
              Write-Host "Starting Gradle tests..."
              
              .\gradlew.bat clean build
